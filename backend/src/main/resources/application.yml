spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock?rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 9090

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zht.entity

wind:
  native-path: src/main/resources/native
